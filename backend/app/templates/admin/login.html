{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark border" style="border-color: var(--aura-gray);">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AURA" width="84" height="84" class="brand-mark-lg">
                        <h4 class="mt-3 fw-bold">Admin Login</h4>
                    </div>
                    <form method="POST" action="{{ url_for('admin.login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-aura w-100 btn-lg">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('frontend.index') }}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Store</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
