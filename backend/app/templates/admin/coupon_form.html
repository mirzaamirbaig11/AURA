{% extends "admin/base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-uppercase mb-0" style="letter-spacing: 2px;">{{ 'Edit' if coupon else 'Add' }} Coupon</h2>
        <a href="{{ url_for('admin.coupons') }}" class="btn btn-aura-outline">
            <i class="fas fa-arrow-left me-2"></i>Back to Coupons
        </a>
    </div>

    <div class="card bg-dark border" style="border-color: var(--aura-gray);">
        <div class="card-body p-4">
            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Coupon Code *</label>
                        <input type="text" name="code" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.code if coupon else '' }}" required {% if coupon %}readonly{% endif %} placeholder="e.g., WELCOME20">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Description</label>
                        <input type="text" name="description" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.description if coupon else '' }}" placeholder="Brief description for admin reference">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Discount Type *</label>
                        <select name="discount_type" class="form-select bg-dark text-white border" style="border-color: var(--aura-gray);" required>
                            <option value="percentage" {% if not coupon or coupon.discount_type == 'percentage' %}selected{% endif %}>Percentage (%)</option>
                            <option value="fixed" {% if coupon and coupon.discount_type == 'fixed' %}selected{% endif %}>Fixed Amount (₹)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Discount Value *</label>
                        <input type="number" step="0.01" name="discount_value" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.discount_value if coupon else '' }}" required min="0.01" placeholder="e.g., 20 for 20% or ₹20">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Minimum Order Amount</label>
                        <input type="number" step="0.01" name="minimum_order_amount" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.minimum_order_amount if coupon else '0' }}" min="0" placeholder="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Usage Limit (Optional)</label>
                        <input type="number" name="usage_limit" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.usage_limit if coupon and coupon.usage_limit else '' }}" min="1" placeholder="Leave empty for unlimited">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Valid From (Optional)</label>
                        <input type="date" name="valid_from" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.valid_from.strftime('%Y-%m-%d') if coupon and coupon.valid_from else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Valid To (Optional)</label>
                        <input type="date" name="valid_to" class="form-control bg-dark text-white border" style="border-color: var(--aura-gray);" value="{{ coupon.valid_to.strftime('%Y-%m-%d') if coupon and coupon.valid_to else '' }}">
                    </div>
                    <div class="col-md-4">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if not coupon or coupon.is_active %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="is_active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top" style="border-color: var(--aura-gray);">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-aura btn-lg">
                            <i class="fas fa-save me-2"></i>{{ 'Update' if coupon else 'Create' }} Coupon
                        </button>
                        <a href="{{ url_for('admin.coupons') }}" class="btn btn-aura-outline btn-lg">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
