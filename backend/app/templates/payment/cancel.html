{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center py-5">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="fas fa-times-circle fa-5x" style="color: #ff4444;"></i>
                    </div>
                    <h1 class="fw-bold mb-3">Payment Cancelled</h1>
                    <p class="text-muted mb-4">Your payment was not completed. No charges were made.</p>

                    <div class="alert alert-warning mb-4">
                        <strong>Order:</strong> {{ order.order_number }}<br>
                        <strong>Amount:</strong> ₹{{ (order.total_amount)|inr }}
                    </div>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a href="{{ url_for('payment.checkout') }}" class="btn btn-aura">
                            <i class="fas fa-credit-card me-2"></i>Try Payment Again
                        </a>
                        <a href="{{ url_for('frontend.cart') }}" class="btn btn-aura-outline">
                            <i class="fas fa-shopping-bag me-2"></i>Return to Cart
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
