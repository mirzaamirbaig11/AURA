{% extends "base.html" %}

{% block content %}
<section class="auth-wrap">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card aura-panel p-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AURA" width="84" height="84" class="brand-mark-lg">
                        <h4 class="mt-3 fw-bold">Forgot Password</h4>
                    </div>
                    <p class="text-muted text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required autofocus placeholder="you@example.com">
                        </div>
                        <button type="submit" class="btn btn-aura w-100 btn-lg">Send Reset Link</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.login') }}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</section>
{% endblock %}
