{% extends "base.html" %}

{% block content %}
<section class="auth-wrap">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card aura-panel p-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AURA" width="84" height="84" class="brand-mark-lg">
                        <h4 class="mt-3 fw-bold">Change Password</h4>
                    </div>
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="confirm" class="form-control" required minlength="6" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-aura w-100 btn-lg">Change Password</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('frontend.account') }}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</section>
{% endblock %}
