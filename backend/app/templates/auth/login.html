{% extends "base.html" %}
{% block title %}Login — AURA{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="aura-panel p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AURA" width="84" height="84" class="brand-mark-lg">
                        <h2 class="mt-3 mb-1">Welcome back</h2>
                        <p class="text-muted mb-0">Log in to track orders, save favourites and check out faster.</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label" for="login-email">Email</label>
                            <input type="email" id="login-email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email" required autofocus>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                        <div class="text-end mb-4">
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-aura w-100 btn-lg">Log In</button>
                    </form>
                    <div class="d-flex align-items-center gap-3 my-4 text-muted small">
                        <hr class="flex-grow-1 m-0"><span>New to AURA?</span><hr class="flex-grow-1 m-0">
                    </div>
                    <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" class="btn btn-aura-outline w-100">Create an Account</a>
                </div>
                <p class="text-center small text-muted mt-3 mb-0"><i class="fas fa-lock me-1"></i> Your details are safe with us.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
